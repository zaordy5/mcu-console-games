name: Firmware menu on STM32F4
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  uart:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Renode 1.17.0
        working-directory: ${{ runner.temp }}
        run: |
          curl -fLsS --retry 2 -o renode.tar.gz 'https://github.com/renode/renode/releases/download/v1.17.0/renode-1.17.0.linux-portable.tar.gz'
          echo '4ba7c68b59e2447f188ef4b4b112fcccd2802582c460beedceb63b84e5605a5f  renode.tar.gz' | sha256sum --check
          mkdir renode
          tar -xzf renode.tar.gz -C renode --strip-components=1
          ./renode/renode --version
      - name: Build the exact revision
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-dev xterm xvfb imagemagick xauth
          mkdir -p build
          git rev-parse HEAD | tee build/commit.txt
          {
            cat /etc/os-release
            cmake --version
            arm-none-eabi-gcc --version
            renode="$RUNNER_TEMP/renode/renode"
            "$renode" --version
            cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=cmake/arm-gcc.cmake
            cmake --build build --verbose
            arm-none-eabi-size build/games.elf
            sha256sum build/games.elf
          } 2>&1 | tee build/build.log
          sed -n '/^mach create/,$p' emulation/stm32f4.resc |
            sed 's@LoadELF \$bin@LoadELF $ORIGIN/games.elf@' > build/games.resc
          cp docs/INTEGRATION.md build/INTEGRATION.md
      - name: Test all games on the host
        run: |
          flags=(-std=c11 -Wall -Wextra -Werror -pedantic -Iinclude -Isrc -Isrc/minesweeper)
          cc "${flags[@]}" src/tetris_core.c tests/tetris_core_test.c -o build/tetris-core-test
          cc "${flags[@]}" src/tetris_core.c src/tetris.c tests/tetris_game_test.c -o build/tetris-game-test
          cc "${flags[@]}" src/minesweeper/*.c tests/minesweeper.c -o build/minesweeper-test
          cc "${flags[@]}" src/pong_core.c tests/pong_core_test.c -o build/pong-core-test
          cc "${flags[@]}" src/pong.c src/pong_core.c tests/pong_game_test.c -o build/pong-game-test
          for test in tetris-core tetris-game minesweeper pong-core pong-game; do
            "build/$test-test"
          done
      - name: Test shared launcher and all games on Renode
        run: |
          renode="$RUNNER_TEMP/renode/renode"
          export TMPDIR="$RUNNER_TEMP/renode tests"
          mkdir -p "$TMPDIR"
          python3 tests/systick_renode.py build/games.elf --renode "$renode"
          python3 tests/menu_renode.py build/games.elf --renode "$renode"
          python3 tests/tetris_renode.py --elf build/games.elf --renode "$renode" --uart-log build/tetris.uart
          python3 tests/pong_renode.py build/games.elf --renode "$renode"
      - name: Capture both launcher screens at 80 x 24
        run: |
          for screen in main-menu difficulty; do
            xvfb-run -a bash -ec '
              title="$1"
              xterm -T "$title" -geometry 80x24 -fa Monospace -fs 14 \
                -e bash -c "cat \"\$1\"; sleep 8" _ "build/menu-check/$title.uart" &
              for attempt in {1..10}; do
                sleep 0.5
                if import -window "$title" "build/$title.png"; then exit 0; fi
              done
              exit 1
            ' _ "$screen"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware-menu
          path: |
            build/commit.txt
            build/build.log
            build/games.elf
            build/games.resc
            build/INTEGRATION.md
            build/menu-check/
            build/pong-check/
            build/tetris.uart
            build/main-menu.png
            build/difficulty.png

  documentation:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Doxygen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends doxygen
      - name: Generate documentation and collect coverage diagnostics
        shell: bash
        run: |
          mkdir -p build
          git rev-parse HEAD > build/doxygen-commit.txt
          {
            doxygen --version
            { cat Doxyfile; printf '\nGENERATE_XML = YES\n'; } | doxygen -
            {
              cat Doxyfile
              printf '\nEXTRACT_ALL = NO\nOUTPUT_DIRECTORY = build/doxygen-audit\n'
              printf 'GENERATE_XML = YES\nWARN_AS_ERROR = YES\n'
            } | doxygen -
            test -s build/doxygen/html/index.html
            test -s build/doxygen-audit/html/index.html
          } 2>&1 | tee build/doxygen.log
          python3 - <<'PY' | tee -a build/doxygen.log
          from collections import Counter
          from pathlib import Path
          from xml.etree import ElementTree as ET

          def symbols(directory):
              index = ET.parse(directory / "index.xml")
              return {(item.attrib["refid"], item.attrib["kind"])
                      for item in index.findall(".//member")}

          full = symbols(Path("build/doxygen/xml"))
          audit = symbols(Path("build/doxygen-audit/xml"))
          if not full or full != audit:
              raise SystemExit(f"Doxygen index mismatch: {sorted(full ^ audit)}")
          print("Doxygen index:", dict(sorted(Counter(kind for _, kind in audit).items())))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doxygen-report
          path: |
            build/doxygen-commit.txt
            build/doxygen.log
            build/doxygen/html/
            build/doxygen/xml/
            build/doxygen-audit/html/
            build/doxygen-audit/xml/
