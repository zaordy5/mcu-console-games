name: Firmware menu on STM32F4
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
permissions:
  contents: read

jobs:
  uart:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Renode 1.17.0
        working-directory: ${{ runner.temp }}
        run: |
          curl -fLsS --retry 2 -o renode.tar.gz 'https://github.com/renode/renode/releases/download/v1.17.0/renode-1.17.0.linux-portable.tar.gz'
          echo '4ba7c68b59e2447f188ef4b4b112fcccd2802582c460beedceb63b84e5605a5f  renode.tar.gz' | sha256sum --check
          mkdir renode
          tar -xzf renode.tar.gz -C renode --strip-components=1
          ./renode/renode --version
      - name: Compile firmware
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-dev xterm xvfb imagemagick xauth
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=cmake/arm-gcc.cmake
          cmake --build build --verbose
      - name: Test Minesweeper rules on the host
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Iinclude -Isrc/minesweeper \
            tests/minesweeper.c src/minesweeper/*.c -o build/minesweeper-check
          ./build/minesweeper-check
      - name: Boot the default Renode demo
        run: |
          demo_log="$RUNNER_TEMP/demo.uart"
          timeout 90s "$RUNNER_TEMP/renode/renode" --disable-gui --hide-analyzers --plain \
            emulation/stm32f4.resc -e "sysbus.usart2 CreateFileBackend @$demo_log true" \
            -e 'emulation RunFor "00:00:02"' -e quit
          grep -F 'Hello World! stm32f4_disco' "$demo_log"
      - name: Test menu input on Renode
        run: |
          { echo "\$bin=@$PWD/build/games.elf"; tail -n +4 emulation/stm32f4.resc; } > "$RUNNER_TEMP/menu.resc"
          args=()
          send_byte() {
            args+=(-e "sysbus.usart2 WriteChar $1" -e "emulation RunFor \"00:00:$2\"")
          }
          send_keys() {
            for byte in "$@"; do send_byte "$byte" 00.20; done
          }
          send_arrow() {
            send_byte 27 00.01
            send_byte 91 00.01
            send_keys "$1"
          }
          # Tetris preview and an Easy board with a question mark, first move, and pause.
          send_keys 49 50 113 50 49
          send_arrow 67
          send_keys 102 63
          send_arrow 68
          send_keys 32
          args+=(-e 'emulation RunFor "00:00:01.20"')
          send_keys 112
          args+=(-e 'emulation RunFor "00:00:02"')
          send_keys 113 50 50 117 113
          # A Logic board on Hard, then the custom and shared field forms.
          send_keys 50 51 103 32
          args+=(-e 'emulation RunFor "00:00:02"')
          send_keys 113 50 50 99 51 50 56 13 108
          layout='12/25/74/1/0'
          # Rapid input also exercises the form's delayed echo.
          for ((index=0; index < ${#layout}; ++index)); do
            printf -v byte '%d' "'${layout:index:1}"
            send_byte "$byte" 00.004
          done
          send_keys 13 119 97 97 102 100
          send_keys 113 51 50 113
          timeout 150s "$RUNNER_TEMP/renode/renode" --disable-gui --hide-analyzers --plain "$RUNNER_TEMP/menu.resc" \
            -e "sysbus.usart2 CreateFileBackend @$PWD/menu.uart true" -e 'emulation RunFor "00:00:00.3"' "${args[@]}" -e quit
          python3 - <<'PY'
          from pathlib import Path
          import re
          raw = Path("menu.uart").read_bytes()
          clear = b"\x1b[2J\x1b[H"
          frames = raw.split(clear)[1:]
          labels = [
              b"MCU Console Games", b"Choose difficulty", b"Tetris preview", b"MCU Console Games",
              b"Choose difficulty", b"L1/3  Easy  Classic", b"MCU Console Games",
              b"Choose difficulty", b"U continue", b"MCU Console Games",
              b"Choose difficulty", b"L1/3  Hard  Logic", b"MCU Console Games",
              b"Choose difficulty", b"Shared layout", b"MCU Console Games",
              b"Choose difficulty", b"Pong preview", b"MCU Console Games",
          ]
          assert len(frames) == len(labels), [frame[:170] for frame in frames]
          for frame, label in zip(frames, labels):
              assert label in frame and b"\x1b[0m" in frame, (label, frame[:300])
          easy, resume, hard, custom = (frames[i] for i in (5, 8, 11, 14))
          selected = b"\x1b[48;2;255;119;191m"
          assert selected + b"[F]" in easy and selected + b"[?]" in easy
          assert b"Mines left 6/7" in easy and b"Mines left 7/7" in easy and b"Cell B1" in easy
          assert selected + b"[ ]" in easy, "The first open must be safe and blank"
          assert b"\x1b[48;2;106;48;94m" in easy, "The first open should flash"
          played, paused = easy.split(b"Minesweeper paused", 1)
          played_times = re.findall(rb"Time (\d{2}:\d{2})", played)
          stopped = re.search(rb"Time (\d{2}:\d{2})", paused)
          assert played_times and stopped, easy[-500:]
          before_pause = played_times[-1]
          restored_frame = resume.split(b"L1/3  Easy  Classic", 1)[1]
          restored = re.search(rb"Time (\d{2}:\d{2})", restored_frame)
          assert restored and b"Cell A1" in restored_frame, restored_frame[:180]
          print(f"Clock at the last game frame, pause and resume: "
                f"{before_pause.decode()}, {stopped[1].decode()}, {restored[1].decode()}")
          assert before_pause == stopped[1] == restored[1] == b"00:01"
          assert not re.search(rb"\x1b\[38;2;217;190;255m\x1b\[48;2;(89;39;81|112;47;96)m \?", restored_frame), (
              "The first open should clear the question mark"
          )
          assert selected + b"[ ]" in hard and b"Layout search failed" not in hard
          assert b"Enter mine count (1-135)" in custom and b"Mines left 28/28" in custom
          assert b"\x1b[3;38HL" in custom
          assert b"Load layout" in custom
          shared = custom.split(b"Shared layout", 1)[1]
          assert b"Mines left 25/25" in shared and b"Cell C7" in shared
          assert b"Opened 41/119" in shared and b"Mines left 24/25" in shared
          assert b"Flags nearby 1/3" in shared
          assert b"\x1b[38;2;255;203;151m" in shared and b"\x1b[38;2;255;133;199m" in shared
          Path("minesweeper.uart").write_bytes(clear + custom)
          PY
          xvfb-run -a sh -ec 'xterm -T "Minesweeper UART" -geometry 64x20 -fa Monospace -fs 14 -e sh -c "cat minesweeper.uart; sleep 8" & sleep 2; import -window "Minesweeper UART" menu.png'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware-menu
          path: |
            build/games.elf
            menu.uart
            menu.png
